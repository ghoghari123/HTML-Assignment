<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <title>Fruit Manager</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>

<body class="bg-light">

    <div class="container mt-5">

        <div class="card shadow mb-4">
            <div class="card-header bg-primary text-white">
                <h4>Add Fruit</h4>
            </div>
            <div class="card-body">
                <form>
                    <div class="row">
                        <div class="col-md-8">
                            <input type="text" class="form-control" placeholder="Enter fruit name" id="fruitinput">
                        </div>
                        <div class="col-md-4">
                            <button class="btn btn-success w-100" type="button" onclick="curdoperation()">Add /
                                Update</button>
                        </div>
                    </div>
                </form>
            </div>
        </div>

        <div class="card shadow">
            <div class="card-header bg-dark text-white d-flex justify-content-between align-items-center">
                <h4 class="mb-0">Fruit List</h4>
                <input type="text" class="form-control w-25" placeholder="Search..." id="searchinput">
            </div>
            <div class="card-body">
                <table class="table table-bordered table-hover text-center">
                    <thead class="table-secondary">
                        <tr>
                            <th>No.</th>
                            <th>Fruits Name</th>
                            <th>Actions</th>
                        </tr>
                    </thead>
                    <tbody id="fruitlist"></tbody>
                </table>
            </div>
        </div>

    </div>

    <script>
        let fruits = [];
        let editIndex = -1;

        function curdoperation() {
            const input = document.getElementById('fruitinput');
            const value = input.value.trim();

            if (value === "") return;

            if (editIndex === -1) {
                fruits.push(value);
            } else {
                fruits[editIndex] = value;
                editIndex = -1;
            }

            input.value = "";
            displayFruits(fruits);
        }

        function displayFruits(data) {
            const table = document.getElementById('fruitlist');
            table.innerHTML = "";

            for (let i = 0; i < data.length; i++) {
                table.innerHTML += `
                    <tr>
                        <td>${i + 1}</td>
                        <td>${data[i]}</td>
                        <td>
                            <button class="btn btn-warning btn-sm" onclick="editFruit(${i})">Edit</button>
                            <button class="btn btn-danger btn-sm" onclick="deleteFruit(${i})">Delete</button>
                        </td>
                    </tr>
                `;
            }
        }

        function deleteFruit(index) {
            fruits.splice(index, 1);
            displayFruits(fruits);
        }

        function editFruit(index) {
            document.getElementById('fruitinput').value = fruits[index];
            editIndex = index;
        }

        document.getElementById("searchinput").addEventListener("keyup", function () {
            const keyword = this.value.toLowerCase();

            const filtered = fruits.filter(function (fruit) {
                return fruit.toLowerCase().includes(keyword);
            });

            displayFruits(filtered);
        });
    </script>

</body>

</html>
