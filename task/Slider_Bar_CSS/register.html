<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Registration form</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>
    <div class="container">
        <div class="img">
            <img src="bgimg.png" alt="">
        </div>
        <form action="">
            <h1>Registration Info</h1>
            <input type="text" placeholder="NAME" class="adjust-width">
            <input type="text" placeholder="BIRTHDATE" class="border">
            <input type="text" placeholder="GENDER" class="border">
            <input type="text" placeholder="CLASS" class="adjust-width">
            <input type="text" placeholder="REGISTRATION CODE" class="adjust-width">
            <button>submit</button>
        </form>
    </div>
</body>

</html>
