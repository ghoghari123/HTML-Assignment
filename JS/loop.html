<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>

<body>
    <script>
        // ================================== FOR LOOP (PRINT 1 TO 10) ================================================
        console.log('FOR LOOPING');
        var d;
        for (d = 1; d <= 10; d++) {
            console.log("d = ", d);
        }

        // ================================== WHILE LOOP (PRINT 1 TO 10) ================================================
        console.log('WHILE LOOPING');
        let i = 1;
        while (i <= 10) {
            console.log("i = ", i);
            i++;
        }

        // ================================== DO-WHILE LOOP (PRINT 1 TO 10) ================================================
        console.log('DO-WHILE LOOPING');
        let m = 1;
        do {
            console.log("m = ", m);
            m++;
        } while (m <= 10)
    </script>
</body>

</html>
