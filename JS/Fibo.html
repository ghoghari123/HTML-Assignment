<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>

<body>
    <fieldset>
        <legend>GENRATE FIBONACCI SERIOES</legend>
        <button onclick="Fibo_Gen()">Gen</button>
        <div id="res1"></div>
    </fieldset>
    <script>
        function Fibo_Gen() {
            let d = 0;
            let d2 = 1;
            let str = `${d},${d2},`;
            let m;
            for (m = 1; m <= 10; m++) {
                let ans = d + d2;
                console.log(d);
                str += `${ans},`;
                d = d2;
                d2 = ans;
            }
            document.getElementById('res1').innerHTML = str;
        }
    </script>
</body>

</html>
