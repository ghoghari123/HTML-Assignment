<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <fieldset>
        <legend>CREATE MULTIPLICATION TABLE</legend>
        <label for="">ENTER TABLE NUMBER :: </label>
        <input type="text" name="" id="table"><br>
        <button onclick="multiplication_table()">CREATE</button>
        <div id="result"></div>
    </fieldset>

    <script>
        function multiplication_table() {
            let num1 = document.getElementById('table').value;
            let str = "";

            for (i=1;i<=num1;i++) {
                str += `${num1} * ${i} = ${num1 * i} <br>`
            }
            document.getElementById('result').innerHTML = str;
        }
    </script>
</body>
</html>
