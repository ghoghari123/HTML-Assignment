<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <script>
        function ifcondition() {
            let num = prompt("Enter Name : ");
            let n1 = prompt(num > 0) ? 'Positive' : 'Nagative';
            alert(n1)
            if (num % 2 == 0) {
                alert("Even")
            }
            else {
                alert('Odd')
            }
        }
        function QUADRANT() {
            let H = prompt('Enter H');
            let D = prompt('Enter D');
            if (H > 0 && D > 0) {
                alert('1')
            }
            else if (H < 0 && D > 0) {
                alert('2')
            }
            else if (H < 0 && D < 0) {
                alert('3')
            }
            else if (H > 0 && D < 0) {
                alert('4')
            }
            else {
                alert("Invalid..!")
            }
        }
    </script>
</head>

<body>
    <button ondblclick="ifcondition()">IF_CONDITIONAL_OPERATER</button>
    <button ondblclick="QUADRANT()">QUADRANT</button>
</body>

</html>
