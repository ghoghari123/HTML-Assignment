<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <fieldset>
        <legend>REVERSE NUMBER</legend>
        <label for="">ENTER NUMBER :: </label>
        <input type="text" name="" id="n"><br>
        <button onclick="rev_num()">REVERSE_Num</button>
        <div id="result"></div>
    </fieldset>
    <script>
        function rev_num() {
            let num = document.getElementById('n').value;
            let rev = 0;
            while (num != 0) {
                let rem = num % 10;
                rev = rev * 10 + rem;
                num = parseInt(num / 10);
            }          
            document.getElementById('result').innerHTML = rev;
        }
    </script>
</body>
</html>
