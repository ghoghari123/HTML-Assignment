<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Boostrap Demo 1</title>
    <link rel="stylesheet" href="static/css/bootstrap.min.css">
    <style>
        #hi{
            color: brown;
        }
    </style>
</head>

<body>
    <h1 class="text-center pt-5">Boostrap</h1>
    <h2 id="hi">Using Block In Boostrap</h2>
    <div >
        <span class="d-block">item-1</span>
        <span class="d-block">item-2</span>
        <span class="d-block">item-3</span>
    </div>
    <h2>Using Inline In Boostrap</h2>
    <div>
        <div class="d-inline">item-1</div>
        <div class="d-inline">item-2</div>
        <div class="d-inline">item-3</div>
    </div>
     <h2>Using Flex In Boostrap</h2>
    <div class="d-flex Flex-row-reverse">
        <div class="p-5 bg-primary text-success bg-danger">item-1</div>
        <div class="p-5 bg-primary bg-success text-warning">item-2</div>
        <div class="p-5 bg-primary bg-light-subtle text-danger">item-3</div>
    </div>
    <link rel="stylesheet" href="/media/js/bootstrap.bundle.min.js">
</body>

</html>
